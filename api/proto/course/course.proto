syntax = "proto3";

package course;

option go_package = "github.com/Romasmi/e-learning-arhitecture/gen/go/course;course";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

service CourseService {
  rpc CreateCourse(CreateCourseRequest) returns (CreateCourseResponse) {
    option (google.api.http) = {
      post: "/courses"
      body: "*"
    };
  }
  rpc UpdateCourse(UpdateCourseRequest) returns (UpdateCourseResponse) {
    option (google.api.http) = {
      put: "/courses/{course_id}"
      body: "*"
    };
  }
  rpc ArchiveCourse(ArchiveCourseRequest) returns (ArchiveCourseResponse) {
    option (google.api.http) = {
      delete: "/courses/{course_id}"
    };
  }
  rpc AddChapter(AddChapterRequest) returns (AddChapterResponse) {
    option (google.api.http) = {
      post: "/courses/{course_id}/chapters"
      body: "*"
    };
  }
  rpc AddLesson(AddLessonRequest) returns (AddLessonResponse) {
    option (google.api.http) = {
      post: "/chapters/{chapter_id}/lessons"
      body: "*"
    };
  }
  rpc AttachCertTest(AttachCertTestRequest) returns (AttachCertTestResponse) {
    option (google.api.http) = {
      post: "/courses/{course_id}/cert-test"
      body: "*"
    };
  }
  rpc GetCourse(GetCourseRequest) returns (GetCourseResponse) {
    option (google.api.http) = {
      get: "/courses/{course_id}"
    };
  }
  rpc ListCourses(ListCoursesRequest) returns (ListCoursesResponse) {
    option (google.api.http) = {
      get: "/courses"
    };
  }
}

enum CourseStatus {
  COURSE_STATUS_UNSPECIFIED = 0;
  DRAFT = 1;
  ARCHIVED = 2;
}

enum LessonType {
  LESSON_TYPE_UNSPECIFIED = 0;
  VIDEO = 1;
  PDF = 2;
  IMAGE = 3;
  QUIZ = 4;
}

message Course {
  string id = 1;
  string portal_id = 2;
  string title = 3;
  string description = 4;
  CourseStatus status = 5;
  repeated Chapter chapters = 6;
  CertTest cert_test = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message Chapter {
  string id = 1;
  string course_id = 2;
  string title = 3;
  int32 position = 4;
  repeated Lesson lessons = 5;
}

message Lesson {
  string id = 1;
  string chapter_id = 2;
  string title = 3;
  LessonType type = 4;
  string asset_id = 5;
  int32 position = 6;
  string asset_status = 7;
}

message CertTest {
  string id = 1;
  string course_id = 2;
  int32 pass_score = 3;
  repeated Question questions = 4;
}

message Question {
  string id = 1;
  string text = 2;
  repeated string options = 3;
  int32 correct_index = 4;
}

message CreateCourseRequest {
  string portal_id = 1;
  string title = 2;
  string description = 3;
}

message CreateCourseResponse {
  Course course = 1;
}

message UpdateCourseRequest {
  string course_id = 1;
  string title = 2;
  string description = 3;
}

message UpdateCourseResponse {
  Course course = 1;
}

message ArchiveCourseRequest {
  string course_id = 1;
}

message ArchiveCourseResponse {
  bool archived = 1;
}

message AddChapterRequest {
  string course_id = 1;
  string title = 2;
  int32 position = 3;
}

message AddChapterResponse {
  Chapter chapter = 1;
}

message AddLessonRequest {
  string chapter_id = 1;
  string title = 2;
  LessonType type = 3;
  string asset_id = 4;
  int32 position = 5;
}

message AddLessonResponse {
  Lesson lesson = 1;
}

message AttachCertTestRequest {
  string course_id = 1;
  int32 pass_score = 2;
  repeated Question questions = 3;
}

message AttachCertTestResponse {
  CertTest cert_test = 1;
}

message GetCourseRequest {
  string course_id = 1;
}

message GetCourseResponse {
  Course course = 1;
}

message ListCoursesRequest {
  string portal_id = 1;
}

message ListCoursesResponse {
  repeated Course courses = 1;
}
